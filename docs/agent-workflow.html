<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; background: #fffdf8; }
  svg { display: block; }
  text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
</style>
</head>
<body>
<svg id="flow" xmlns="http://www.w3.org/2000/svg" width="950" height="1390" viewBox="0 0 950 1390">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8377" />
    </marker>
    <marker id="ar-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ad4526" />
    </marker>
  </defs>

  <rect x="0" y="0" width="950" height="1390" fill="#fffdf8" />

  <!-- ===== 阶段泳道 ===== -->
  <rect x="16" y="30" width="914" height="310" rx="10" fill="#faf6ee" />
  <rect x="16" y="340" width="914" height="215" rx="10" fill="#fdfaf3" />
  <rect x="16" y="555" width="914" height="445" rx="10" fill="#faf6ee" />
  <rect x="16" y="1000" width="914" height="310" rx="10" fill="#fdfaf3" />

  <text x="88" y="185" transform="rotate(-90 88 185)" text-anchor="middle" font-size="15" font-weight="700" fill="#b3ab9d">① 输入理解</text>
  <text x="88" y="447" transform="rotate(-90 88 447)" text-anchor="middle" font-size="15" font-weight="700" fill="#b3ab9d">② 检索与编排</text>
  <text x="88" y="777" transform="rotate(-90 88 777)" text-anchor="middle" font-size="15" font-weight="700" fill="#b3ab9d">③ 校验与修复</text>
  <text x="88" y="1155" transform="rotate(-90 88 1155)" text-anchor="middle" font-size="15" font-weight="700" fill="#b3ab9d">④ 呈现与导出</text>

  <!-- ===== 连线（先画，压在节点下）===== -->
  <g fill="none" stroke="#8a8377" stroke-width="1.7">
    <path d="M330 96 L330 136" marker-end="url(#ar)" />
    <path d="M330 202 L330 225" marker-end="url(#ar)" />
    <path d="M330 323 L330 351" marker-end="url(#ar)" />
    <path d="M330 417 L330 456" marker-end="url(#ar)" />
    <path d="M330 522 L330 563" marker-end="url(#ar)" />
    <path d="M330 635 L330 662" marker-end="url(#ar)" />
    <path d="M330 756 L330 787" marker-end="url(#ar)" />
    <path d="M330 852 L330 893" marker-end="url(#ar)" />
    <path d="M330 965 L330 1011" marker-end="url(#ar)" />
    <path d="M330 1077 L330 1121" marker-end="url(#ar)" />
    <path d="M330 1187 L330 1237" marker-end="url(#ar)" />

    <!-- D1 否 → 澄清卡 -->
    <path d="M455 275 L548 275" marker-end="url(#ar)" />

    <!-- 澄清卡 → 回到 N1 -->
    <path d="M550 275 L500 275 L500 170 L462 170" marker-end="url(#ar)" />

    <!-- D2 是 → 归因 -->
    <path d="M445 710 L548 710" marker-end="url(#ar)" />

    <!-- 修复链 -->
    <path d="M700 746 L700 784" marker-end="url(#ar)" />
    <path d="M700 856 L700 894" marker-end="url(#ar)" />

    <!-- N6 用户就地改 → 回到 N3 -->
    <path d="M200 930 L168 930 L168 490 L198 490" marker-end="url(#ar)" />
  </g>

  <!-- 修复回环：虚线 -->
  <path d="M700 966 L700 1002 L480 1002 L480 600 L462 600" fill="none" stroke="#ad4526" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#ar-d)" />

  <!-- ===== 节点 ===== -->
  <!-- 起点 -->
  <g>
    <rect x="220" y="44" width="220" height="52" rx="26" fill="#ad4526" />
    <text x="330" y="76" text-anchor="middle" font-size="15.5" font-weight="700" fill="#fffdf8">用户：一句话说清想怎么玩</text>
  </g>

  <!-- N1 -->
  <g>
    <rect x="200" y="138" width="260" height="64" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="330" y="163" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">① 意图解析 · 槽位抽取</text>
    <text x="330" y="185" text-anchor="middle" font-size="11.5" fill="#8a8377">目的地 / 天数 / 日期 / 人数 / 预算 / 偏好 / 节奏</text>
  </g>

  <!-- D1 -->
  <g>
    <polygon points="330,227 455,275 330,323 205,275" fill="#f7ecd6" stroke="#a8761c" stroke-width="1.4" />
    <text x="330" y="272" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1a17">槽位齐备？</text>
    <text x="330" y="292" text-anchor="middle" font-size="11" fill="#a8761c">缺则必问，不缺不打扰</text>
  </g>
  <text x="474" y="268" font-size="12" fill="#8a8377">否</text>
  <text x="340" y="344" font-size="12" fill="#8a8377">是</text>

  <!-- 澄清卡 -->
  <g>
    <rect x="550" y="240" width="300" height="72" rx="10" fill="#e2ede9" stroke="#2c6459" stroke-width="1.4" stroke-dasharray="5 4" />
    <text x="700" y="267" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b1a17">澄清卡追问（用户交互）</text>
    <text x="700" y="289" text-anchor="middle" font-size="11.5" fill="#2c6459">只问缺的那一项，已说的全部沿用</text>
  </g>
  <text x="505" y="246" font-size="11.5" fill="#8a8377" text-anchor="end">补全后重析</text>

  <!-- N2 -->
  <g>
    <rect x="200" y="353" width="260" height="64" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="330" y="378" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">② POI 检索 · 城市包装载</text>
    <text x="330" y="400" text-anchor="middle" font-size="11.5" fill="#8a8377">坐标、开放时间、门票、需否预约</text>
  </g>

  <!-- N3 -->
  <g>
    <rect x="200" y="458" width="260" height="64" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="330" y="483" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">③ 约束编排</text>
    <text x="330" y="505" text-anchor="middle" font-size="11.5" fill="#8a8377">时间窗 + 地理聚类 + 交通时长</text>
  </g>

  <!-- N4 关键节点 -->
  <g>
    <rect x="200" y="565" width="260" height="70" rx="10" fill="#f5e4dc" stroke="#ad4526" stroke-width="2" />
    <text x="330" y="591" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ad4526">④ 八项可行性校验</text>
    <text x="330" y="612" text-anchor="middle" font-size="11" fill="#8a4a2e">时间·距离·开放·跨区·用餐·体力·预算·预订</text>
  </g>

  <!-- D2 -->
  <g>
    <polygon points="330,664 445,710 330,756 215,710" fill="#f7ecd6" stroke="#a8761c" stroke-width="1.4" />
    <text x="330" y="707" text-anchor="middle" font-size="15" font-weight="700" fill="#1b1a17">存在违规？</text>
    <text x="330" y="727" text-anchor="middle" font-size="11" fill="#a8761c">硬冲突 / 软不适</text>
  </g>
  <text x="462" y="703" font-size="12" fill="#8a8377">是</text>
  <text x="340" y="780" font-size="12" fill="#8a8377">否</text>

  <!-- B1 -->
  <g>
    <rect x="550" y="674" width="300" height="72" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="700" y="701" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b1a17">违规归因</text>
    <text x="700" y="723" text-anchor="middle" font-size="11.5" fill="#8a8377">区分硬冲突（去不了）与软不适（太赶）</text>
  </g>

  <!-- B2 -->
  <g>
    <rect x="550" y="784" width="300" height="72" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="700" y="811" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1b1a17">⑤ 定向修复算子</text>
    <text x="700" y="833" text-anchor="middle" font-size="11.5" fill="#8a8377">移位 / 换点 / 删点 / 加缓冲 / 换天</text>
  </g>

  <!-- B3 -->
  <g>
    <rect x="550" y="894" width="300" height="72" rx="10" fill="#f5e4dc" stroke="#ad4526" stroke-width="1.6" />
    <text x="700" y="921" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ad4526">重新编排并回验</text>
    <text x="700" y="943" text-anchor="middle" font-size="11.5" fill="#8a4a2e">最多 3 轮，仍不收敛则标注风险</text>
  </g>
  <text x="492" y="995" font-size="11.5" fill="#ad4526">回验（回到 ④）</text>

  <!-- N5 -->
  <g>
    <rect x="200" y="789" width="260" height="64" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="330" y="814" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">生成校验报告</text>
    <text x="330" y="836" text-anchor="middle" font-size="11.5" fill="#8a8377">每条结论对应一条规则，可溯源</text>
  </g>

  <!-- N6 -->
  <g>
    <rect x="200" y="896" width="260" height="70" rx="10" fill="#e2ede9" stroke="#2c6459" stroke-width="1.4" stroke-dasharray="5 4" />
    <text x="330" y="922" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">⑥ 确认卡（用户交互）</text>
    <text x="330" y="943" text-anchor="middle" font-size="11.5" fill="#2c6459">结构化摘要，逐项可改，改了就重规划</text>
  </g>
  <text x="176" y="905" font-size="11.5" fill="#2c6459" text-anchor="middle">改需求</text>
  <text x="176" y="920" font-size="11.5" fill="#2c6459" text-anchor="middle">就地重规划</text>

  <!-- N7 -->
  <g>
    <rect x="200" y="1013" width="260" height="64" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="330" y="1038" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">时间轴行程 + 启发式提示</text>
    <text x="330" y="1060" text-anchor="middle" font-size="11.5" fill="#8a8377">出发提醒 / 天气 / 叫车 / 地图</text>
  </g>

  <!-- N8 -->
  <g>
    <rect x="200" y="1123" width="260" height="64" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.4" />
    <text x="330" y="1148" text-anchor="middle" font-size="15.5" font-weight="700" fill="#1b1a17">⑦ 导出与留存</text>
    <text x="330" y="1170" text-anchor="middle" font-size="11.5" fill="#8a8377">ICS 日历 / JSON / 分享页 / 回忆长页</text>
  </g>

  <!-- 终点 -->
  <g>
    <rect x="220" y="1239" width="220" height="52" rx="26" fill="#ad4526" />
    <text x="330" y="1271" text-anchor="middle" font-size="15" font-weight="700" fill="#fffdf8">可以证明合理的行程</text>
  </g>

  <!-- ===== 异常处理说明卡 ===== -->
  <g>
    <rect x="560" y="1020" width="330" height="142" rx="10" fill="#fff" stroke="#d3c9b7" stroke-width="1.3" />
    <text x="578" y="1045" font-size="13.5" font-weight="700" fill="#1b1a17">异常与降级（不打断主流程）</text>
    <text x="578" y="1069" font-size="11.5" fill="#4c4840">· 模型超时 / 限流：退避重试，仍失败转内置数据</text>
    <text x="578" y="1091" font-size="11.5" fill="#4c4840">· 字段拿不准：宁可留空，不编造</text>
    <text x="578" y="1113" font-size="11.5" fill="#4c4840">· 3 轮修复不收敛：输出并标注残余风险</text>
    <text x="578" y="1135" font-size="11.5" fill="#4c4840">· 断网：读本地缓存，仅禁用实时部分</text>
  </g>

  <!-- ===== 图例 ===== -->
  <g>
    <line x1="200" y1="1345" x2="240" y2="1345" stroke="#8a8377" stroke-width="1.7" marker-end="url(#ar)" />
    <text x="248" y="1349" font-size="11.5" fill="#8a8377">正常流转</text>

    <line x1="330" y1="1345" x2="370" y2="1345" stroke="#ad4526" stroke-width="1.7" stroke-dasharray="6 5" marker-end="url(#ar-d)" />
    <text x="378" y="1349" font-size="11.5" fill="#8a8377">回环 / 重试</text>

    <rect x="470" y="1336" width="34" height="18" rx="4" fill="#e2ede9" stroke="#2c6459" stroke-width="1.2" stroke-dasharray="4 3" />
    <text x="512" y="1349" font-size="11.5" fill="#8a8377">用户交互</text>

    <rect x="590" y="1336" width="34" height="18" rx="4" fill="#f5e4dc" stroke="#ad4526" stroke-width="1.4" />
    <text x="632" y="1349" font-size="11.5" fill="#8a8377">设计重点</text>
  </g>
</svg>
</body>
</html>
